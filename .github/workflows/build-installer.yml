name: Build Prorab Windows installer
on:
  push:
    branches: [main, codex/windows-trial]
    paths:
      - '.github/workflows/build-installer.yml'
      - 'prorab-source.zip'
      - 'skills-bundle/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unpack published source archive
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath prorab-source.zip -DestinationPath unpacked -Force
          $project = Get-ChildItem -Path unpacked -Recurse -Filter package.json -File |
            Where-Object { $_.DirectoryName -notmatch '(node_modules|__MACOSX)' } |
            Select-Object -First 1
          if (!$project) { throw "No package.json in source archive" }
          $path = $project.DirectoryName
          echo "PRORAB_DIR=$path" >> $env:GITHUB_ENV
          Write-Host "Source dir: $path"
          if (!(Test-Path (Join-Path $path 'packaging/build-windows.ps1'))) {
            throw "Windows builder missing from source archive"
          }
      - name: Bundle practical starter skills
        shell: pwsh
        run: |
          $root = $env:PRORAB_DIR
          Copy-Item -Path 'skills-bundle/agents/*' -Destination (Join-Path $root 'agents') -Recurse -Force
          Copy-Item -Path 'skills-bundle/test/starter-skills.test.js' -Destination (Join-Path $root 'test/starter-skills.test.js') -Force
          foreach ($rel in @('packaging/Prorab.iss','packaging/build-windows.ps1','package.json','web/app.js')) {
            $file = Join-Path $root $rel
            $source = Get-Content -LiteralPath $file -Raw -Encoding utf8
            $source = $source -replace '0\.3\.[0-9]+','0.3.4'
            [System.IO.File]::WriteAllText($file, $source, [System.Text.UTF8Encoding]::new($false))
          }
          Write-Host 'Installed 9 new skills, total expected: 11'
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Test source
        shell: pwsh
        run: |
          Set-Location $env:PRORAB_DIR
          node --test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa/smoke-installed.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node qa/load-agent.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          Set-Location $env:PRORAB_DIR
          $script = (Resolve-Path .\packaging\build-windows.ps1).Path
          $source = Get-Content -LiteralPath $script -Raw -Encoding utf8
          Set-Content -LiteralPath $script -Value $source -Encoding utf8BOM
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify bundled runtime and installer
        shell: pwsh
        run: |
          Set-Location $env:PRORAB_DIR
          if (!(Test-Path 'build/runtime/node.exe')) { throw "Node runtime missing" }
          if (!(Test-Path 'build/Прораб.exe')) { throw "Launcher missing" }
          $exe = Get-ChildItem 'dist/Prorab-Setup-*.exe' -File | Select-Object -First 1
          if (!$exe) { throw "Installer missing" }
          Write-Host "Installer: $($exe.Length) bytes"
          Get-FileHash $exe.FullName -Algorithm SHA256
      - name: Install, launch, persist memory, uninstall and reinstall
        shell: pwsh
        run: |
          Set-Location $env:PRORAB_DIR
          $installer = (Get-ChildItem 'dist/Prorab-Setup-*.exe' -File | Select-Object -First 1).FullName
          ./qa/windows-installer-smoke.ps1 -Installer $installer
      - name: Publish actual Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Prorab-Windows-Setup
          path: ${{ env.PRORAB_DIR }}/dist/Prorab-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
